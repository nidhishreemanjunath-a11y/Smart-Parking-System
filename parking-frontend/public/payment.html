<!DOCTYPE html>
<html>
<head>
<title>Payment</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Arial;
    background: linear-gradient(to right, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* CONTAINER */
.container {
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 700px;
    box-shadow: 0px 10px 30px rgba(0,0,0,0.3);
    animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px);}
    to { opacity: 1; transform: translateY(0);}
}

h2 {
    text-align: center;
    color: #2a5298;
}

.amount {
    text-align: center;
    font-weight: bold;
    margin-bottom: 20px;
    font-size: 18px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

/* SECTION */
.section {
    border: 1px solid #eee;
    padding: 20px;
    border-radius: 10px;
    transition: 0.3s;
}

.section:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

/* INPUT */
input {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

input:focus {
    outline: none;
    border: 1px solid #2a5298;
    box-shadow: 0 0 5px rgba(42,82,152,0.5);
}

/* BUTTON */
button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    background: #2a5298;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* QR */
.qr img {
    width: 180px;
    display: block;
    margin: auto;
}

/* CASH */
.cash {
    margin-top: 15px;
}

/* LOADER */
.loader {
    display: none;
    text-align: center;
    margin-top: 15px;
    animation: fadeIn 0.5s ease;
}

.spinner {
    border: 4px solid #eee;
    border-top: 4px solid #2a5298;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    animation: spin 1s linear infinite;
    margin: auto;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}
</style>

</head>

<body>

<div class="container">

    <h2>💳 Payment</h2>
    <div class="amount" id="amount"></div>

    <div class="grid">

        <!-- CARD -->
        <div class="section">
            <h3>Card Payment</h3>
            <input placeholder="Card Number" id="cardNumber">
            <input placeholder="Expiry (MM/YY)" id="expiry">
            <input placeholder="CVV" id="cvv">
            <button onclick="payCard()">Pay with Card</button>
        </div>

        <!-- UPI -->
        <div class="section qr">
            <h3 style="text-align:center;">UPI Payment</h3>
            <img id="qrImage">
            <button onclick="payUPI()">I have Paid</button>
        </div>

    </div>

    <div class="cash">
        <button onclick="pay('Cash')">Pay Cash</button>
    </div>

    <!-- LOADER -->
    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Processing Payment...</p>
    </div>

</div>

<script>
let bookings = JSON.parse(localStorage.getItem("bookings"));

let total = 0;
bookings.forEach(b => total += b.hours * 50);

document.getElementById("amount").innerHTML = "Total: ₹" + total;

/* QR */
document.getElementById("qrImage").src =
`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=upi://pay?pa=parking@upi&pn=Parking&am=${total}`;

/* LOADER */
function showLoader(callback) {
    document.getElementById("loader").style.display = "block";

    setTimeout(() => {
        callback();
    }, 2000);
}

/* CARD */
function payCard() {
    let card = document.getElementById("cardNumber").value;
    let cvv = document.getElementById("cvv").value;

    if (!card || !cvv) {
        alert("Enter card details");
        return;
    }

    showLoader(() => {
        window.location.href = "/success.html";
    });
}

/* UPI */
function payUPI() {
    showLoader(() => {
        window.location.href = "/success.html";
    });
}

/* CASH */
function pay(method) {
    showLoader(() => {
        window.location.href = "/success.html";
    });
}

/* CLICK ANIMATION */
document.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
        btn.style.transform = "scale(0.95)";
        setTimeout(() => btn.style.transform = "scale(1)", 150);
    });
});
</script>

</body>
</html>
