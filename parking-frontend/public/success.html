<!DOCTYPE html>
<html>
<head>
<title>Success</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(to right, #11998e, #38ef7d);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* BOX */
.box {
    text-align: center;
    color: white;
    animation: fadeIn 0.6s ease;
}

/* CHECK */
.checkmark {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: white;
    margin: auto;
    position: relative;
    animation: pop 0.5s ease;
}

.checkmark::after {
    content: "";
    position: absolute;
    left: 28px;
    top: 50px;
    width: 25px;
    height: 12px;
    border-left: 6px solid green;
    border-bottom: 6px solid green;
    transform: rotate(-45deg);
}

.checkmark::before {
    content: "";
    position: absolute;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    animation: ripple 1s infinite;
}

@keyframes pop {
    0% { transform: scale(0); }
    80% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

@keyframes ripple {
    0% { transform: scale(1); opacity: 0.6; }
    100% { transform: scale(1.6); opacity: 0; }
}

button {
    margin-top: 20px;
    padding: 10px 15px;
    border: none;
    background: white;
    color: #11998e;
    border-radius: 8px;
    cursor: pointer;
}
</style>

</head>

<body>

<div class="box">
    <div class="checkmark"></div>
    <h2>Payment Successful 🎉</h2>
    <p>Your booking is confirmed</p>

    <button onclick="goReceipt()">View Receipt</button>
</div>

<script>
function goReceipt() {
    window.location.href = "/receipt.html";
}
</script>

</body>
</html>
